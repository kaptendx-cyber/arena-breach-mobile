name: Build Godot APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          export-templates: true
          
      - name: Generate Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          
      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/arena-breach.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-breach-apk
          path: build/arena-breach.apk

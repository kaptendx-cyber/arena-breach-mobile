name: Build Godot Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix Code Formatting
      run: |
        # 1. Ubah semua 4-spasi jadi 1 Tab di semua file .gd
        find . -name "*.gd" -exec sed -i 's/    /\t/g' {} +
        
        # 2. Hapus spasi di config/name project.godot
        sed -i 's/config\/name="Arena Breach Mobile"/config\/name="ArenaBreachMobile"/g' project.godot

    - name: Download Godot & Extract Android Template
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
        unzip -q Godot_v4.3-stable_linux.x86_64.zip
        mv Godot_v4.3-stable_linux.x86_64 godot
        chmod +x godot
        
        wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
        unzip -q Godot_v4.3-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/4.3.stable
        mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
        mkdir -p android
        unzip -q ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/
        rm -rf templates Godot_v4.3-stable_export_templates.tpz

    - name: Setup Android SDK Manual
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

    - name: Configure Godot Editor Settings
      run: |
        mkdir -p ~/.config/godot
        echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
        echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
        echo 'export/android/java_sdk_path = "'$JAVA_HOME'"' >> ~/.config/godot/editor_settings-4.tres
        echo 'export/android/android_sdk_path = "'$HOME'/android-sdk"' >> ~/.config/godot/editor_settings-4.tres
        echo 'export/android/debug_keystore = "'$HOME'/.android/debug.keystore"' >> ~/.config/godot/editor_settings-4.tres
        echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
        echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres

    - name: Generate Keystore & Build APK
      run: |
        mkdir -p ~/.android
        keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
        
        mkdir -p build
        ./godot --headless --path . --export-debug "Android" build/arena-breach.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: arena-breach-apk
        path: build/arena-breach.apk
